name: Deploy

on:
  push:
    branches:
      - master
      - renovate/**
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref_name != github.event.repository.default_branch && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version-file: package.json

      - name: Install dependencies 📦
        run: sfw vp install --frozen-lockfile --prefer-offline

      - name: Build
        run: vp build

      - name: D1 Migrate
        # IF master THEN migrate ELSE I don't know, need to figure it out
        if: github.ref_name == github.event.repository.default_branch
        run: vp run wrangler:migrate --remote\
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy
        run: ${{ github.ref_name != github.event.repository.default_branch && 'vp exec wrangler versions upload --preview-alias ${BRANCH}' || 'vp exec wrangler deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e9b0348e83d33e46fbb82c3271317d70
          BRANCH: ${{ replace(github.head_ref || github.ref_name, '/', '-') }}
