name: Deploy

on:
  push:
    branches:
      - master
      - renovate/**
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref_name != github.event.repository.default_branch && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version-file: package.json

      - name: Install dependencies 📦
        run: sfw vp install --frozen-lockfile --prefer-offline

      - name: Build
        run: vp build

      - name: D1 Migrate
        # IF master THEN migrate ELSE I don't know, need to figure it out
        if: github.ref_name == github.event.repository.default_branch
        run: vp run wrangler:migrate --remote\
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy preview
        if: github.ref_name != github.event.repository.default_branch
        run: |
          BRANCH="${BRANCH//\//-}"
          BRANCH="${BRANCH//./-}"
          vp exec wrangler versions upload --preview-alias "${BRANCH}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e9b0348e83d33e46fbb82c3271317d70
          BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Deploy
        if: github.ref_name == github.event.repository.default_branch
        run: vp exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e9b0348e83d33e46fbb82c3271317d70
